<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x013318908</title>
<meta name="description" content="x013318908 の個人ページ。つくっているサイトの置き場。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0ec;
    --ink: #1e2421;
    --muted: #5e6862;
    --line: #c9cec8;
    --accent: #2f4f7f;
    --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a18; --ink: #e6e9e5; --muted: #98a29b; --line: #323a36; --accent: #8fb0e0;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.8;
  }
  main {
    max-width: 38rem;
    margin: 0 auto;
    padding: clamp(3rem, 12vh, 7rem) 1.5rem 4rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 9vw, 3.8rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    word-break: break-all;
  }
  .lead { margin: 1.25rem 0 0; color: var(--muted); }
  h2 { margin: 4rem 0 0; font-size: 1rem; font-weight: 500; color: var(--muted); }
  ul { list-style: none; margin: 1rem 0 0; padding: 0; border-top: 1px solid var(--line); }
  li { padding: 1.25rem 0; border-bottom: 1px solid var(--line); }
  .name { font-size: 1.35rem; font-weight: 700; line-height: 1.4; }
  .name a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 0.25em; text-decoration-thickness: 2px; }
  .name a:hover { color: var(--accent); }
  .desc { margin: 0.25rem 0 0; color: var(--muted); }
  footer { margin-top: 4rem; font-size: 0.9rem; color: var(--muted); }
  footer a { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>x013318908</h1>
  <p class="lead">ひとりでサイトをつくっています</p>

  <footer>
    <a href="https://github.com/x013318908">GitHub</a>
  </footer>
</main>
</body>
</html>
